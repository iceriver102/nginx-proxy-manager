set $short_proxy_pass_http 1;
set $short_proxy_pass_https 1;
set $proxy_pass $forward_scheme://$server:$port$request_uri;

add_header       X-Served-By $host;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Scheme $scheme;
proxy_set_header X-Forwarded-Proto  $scheme;
proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP          $remote_addr;

if ($forward_scheme != "http"){
    set $short_proxy_pass_http 0;
}

if ($port != 80){
    set $short_proxy_pass_http 0;
}

if ($forward_scheme != "https"){
    set $short_proxy_pass_https 0;
}

if ($port != 443){
    set $short_proxy_pass_https 0;
}


if ($short_proxy_pass_http){
    set $proxy_pass  $forward_scheme://$server$request_uri;
}

if ($short_proxy_pass_https){
    set $proxy_pass  $forward_scheme://$server$request_uri;
}

proxy_pass  $proxy_pass;
